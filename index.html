<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio — Software Developer & Photographer/Videographer" />
    <title>Tobyan Sohn</title>
    <meta property="og:title" content="Tobyan Sohn" />
    <meta property="og:description" content="Software Developer, Photographer & Videographer based in Austin, TX." />
    <meta property="og:image" content="https://tobyansohn.com/og-image.jpg" />
    <meta property="og:url" content="https://tobyansohn.com" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tobyansohn.com/og-image.jpg" />

    <!-- Preload LCP hero image — RESPONSIVE form so mobile picks 800w (not 1920w).
         Mirrors the srcset/sizes on the <img> in Home.jsx so the browser
         negotiates the right variant before React renders. -->
    <link
      rel="preload"
      as="image"
      imagesrcset="/_vercel/image?url=%2FDSC04511.jpg&w=800&q=82 800w, /_vercel/image?url=%2FDSC04511.jpg&w=1200&q=82 1200w, /_vercel/image?url=%2FDSC04511.jpg&w=1920&q=82 1920w"
      imagesizes="100vw"
      fetchpriority="high" />

    <!-- Fonts: non-blocking via <link> + preconnect (was a render-blocking @import in CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Manrope:wght@300;400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
